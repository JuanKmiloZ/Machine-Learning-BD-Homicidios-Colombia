
services:
  mysql:
    image: mysql:8.0
    container_name: mysql_homicidios
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: homicidios_db
      MYSQL_USER: Rai
      MYSQL_PASSWORD: hom123
    ports:
      - "3307:3306"
    command: >
      --local-infile=1
      --secure-file-priv=""
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-config/mysql.cnf:/etc/mysql/conf.d/mysql.cnf   # ✔ configuración correcta
      - ./mysql-init:/docker-entrypoint-initdb.d               # ✔ creación de tablas
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5

  adminer:
    image: adminer
    container_name: adminer_homicidios
    restart: unless-stopped
    ports:
      - "8080:8080"

  etl:
    build:
      context: .
      dockerfile: docker/Dockerfile         # ✔ Dockerfile del ETL
    container_name: etl_homicidios
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./DL_ETL:/app/DL_ETL                # ✔ monta código ETL
      - ./logs:/var/log                     # ✔ logs del cron
      - ./docker/cron:/etc/cron.d           # ✔ cron jobs
    environment:
      PYTHONUNBUFFERED: 1
    command: [ "/bin/bash", "/docker-entrypoint.sh" ]  # ✔ habilita cron y ETL

volumes:
  mysql_data:
